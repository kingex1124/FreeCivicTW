name: Verify static site
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    # Keep this tag aligned with @playwright/test in package.json/package-lock.json.
    # Browsers and Linux libraries are preinstalled; no apt installation at runtime.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --init --ipc=host
    strategy:
      matrix:
        base-path: ['', '/FreeCivicTW']
    env:
      NEXT_PUBLIC_SITE_ORIGIN: http://localhost:4173
      NEXT_PUBLIC_BASE_PATH: ${{ matrix.base-path }}
      NEXT_PUBLIC_ANALYTICS_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:dev
