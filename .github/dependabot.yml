version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # typescript-eslint 8.72.2 supports TypeScript >=4.8.4 <6.1.0.
    # Review this boundary together with the linter before upgrading the compiler.
    ignore:
      - dependency-name: typescript
        versions: ['>=6.1.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
